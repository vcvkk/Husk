name: ART on arm64

# Builds ART (dex2oat, dalvikvm, libcore) on an arm64 Linux runner, where
# art_standalone builds natively, and runs tests/dvm's programs on it. dalvikvm
# compiles each program ahead of time for the runner's CPU, so this produces and
# runs arm64 oat files: the input oat2macho turns into Mach-O for Apple devices.

on:
  push:
    branches: [husk-port]
    paths: ['port/art/**', 'tests/dvm/**', 'src/dvm/**', 'tools/oat2macho.c', 'tools/oat-dlopen-test.c', '.github/workflows/art.yml']
  workflow_dispatch:

jobs:
  art:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build autoconf automake libtool pkg-config clang zlib1g-dev openjdk-21-jdk-headless \
            libbsd-dev libunwind-dev libelf-dev libicu-dev libssl-dev libexpat1-dev zip liblz4-dev liblzma-dev \
            libcap-dev libegl-dev libpng-dev valgrind binutils

      - name: Cache ART build
        uses: actions/cache@v4
        with:
          path: build/art
          key: art-${{ runner.arch }}-${{ hashFiles('port/art/**') }}

      - name: Build ART
        run: ART_INSTALL=1 port/art/build.sh

      - name: DVM tests (also records the JVM's expected output)
        run: tests/dvm/run.sh

      - name: Tests on ART, interpreter (heap above 4 GiB, patch 0008)
        run: OUT=build/art-tests-int DALVIKVM_FLAGS="-Xint -Xnoimage-dex2oat" port/art/test.sh

      - name: Tests on ART, the programs compiled ahead of time for arm64
        # no boot image yet (images with the heap above 4 GiB are next): the class library
        # runs in the interpreter, the tests' own code is compiled
        run: DALVIKVM_FLAGS="-Xnoimage-dex2oat" port/art/test.sh

      - name: Every oat file converts for iOS
        run: |
          clang -std=c11 -O1 -Wall -Wextra tools/oat2macho.c -o build/oat2macho
          mkdir -p build/ios-dylibs
          for f in build/art-tests/oat/*; do build/oat2macho --ios "$f" "build/ios-dylibs/$(basename "$f" | tr '@' '_').dylib"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm64-oat
          path: |
            build/art-tests/oat
            build/ios-dylibs
            build/art/art-build.log
          if-no-files-found: ignore

  # dyld is the judge of a Mach-O file: load the converted oat files on Apple
  # Silicon, signed as an app would sign them, and check what ART relies on.
  darwin:
    needs: art
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arm64-oat
          path: build
      - name: Convert, sign and dlopen on macOS arm64
        run: |
          clang -std=c11 -O1 -Wall -Wextra tools/oat2macho.c -o build/oat2macho
          clang -O1 -Wall tools/oat-dlopen-test.c -o build/oat-dlopen-test
          mkdir -p build/macos-dylibs
          for f in build/art-tests/oat/*; do
            out="build/macos-dylibs/$(basename "$f" | tr '@' '_').dylib"
            build/oat2macho --macos "$f" "$out"
            codesign -s - -f "$out"
          done
          codesign -v build/macos-dylibs/*.dylib
          build/oat-dlopen-test build/macos-dylibs/*.dylib
