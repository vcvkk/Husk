name: An APK on macOS

# Runs an app other than the test app on the macOS test host, under lldb so a crash leaves its
# backtrace: the runtime and boot image come from a run of "ART runtime on Darwin", the app's
# compiled code (an app/ folder as macos.tgz has it, packed as a .tgz) from a URL. tests/run-apk.env says
# which: RUN_ID, APP_URL, SECONDS, and HOST_ARGS (taps, typing) and PROFILE_AT (a CPU profile) if wanted; a push
# changing it runs this.

on:
  push:
    branches: [husk-port]
    paths: ['tests/run-apk.env']

jobs:
  run:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: What to run
        run: grep -v '^#' tests/run-apk.env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: { name: darwin-runtime, path: build, run-id: '${{ env.RUN_ID }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@v4
        with: { name: app-macos, path: build, run-id: '${{ env.RUN_ID }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@v4
        with: { name: ComposeHello-ipa, path: build/ipa, run-id: '${{ env.RUN_ID }}', github-token: '${{ github.token }}' }
      - name: Unpack, the app in place of the test app, sign the compiled code
        run: |
          brew install lz4 xz icu4c openssl@3 epoll-shim > /dev/null 2>&1 || true
          tar -xzf build/darwin-runtime.tgz -C build
          mkdir -p build/app && tar -xzf build/macos.tgz -C build/app
          rm -rf build/app/app
          # APP_URL: one URL, or the parts of the .tgz in order (file hosts take only so much at once)
          for i in 1 2 3 4 5; do   # the file host answers a busy page now and then
            rm -f build/app.tgz
            for u in ${{ env.APP_URL }}; do curl -sSL -A 'Mozilla/5.0' "$u" >> build/app.tgz; done
            gzip -t build/app.tgz 2>/dev/null && break
            echo "download $i: $(head -c 200 build/app.tgz | tr -cd '[:print:]')"; sleep $((i * 10))
          done
          tar -xzf build/app.tgz -C build/app
          ls -la build/app/app build/app/app/oat/arm64
          # the CA certificates the iOS app has (ANDROID_ROOT/etc/security/cacerts: the runtime's directory, as on a phone)
          (cd build/ipa && unzip -q ComposeHello.ipa 'Payload/*/art/etc/*') && cp -R build/ipa/Payload/*/art/etc build/app/boot/
          for f in build/app/boot/arm64/*.dylib build/app/app/oat/arm64/*.dylib; do codesign -s - -f "$f"; done
      - name: Natives and the test host
        run: port/framework/build-natives.sh macos build/fw build/darwin/include/nativehelper "$PWD/build/darwin/lib"
      - name: Run it under lldb
        run: |
          set +e
          mkdir -p build/frames
          export HUSK_FRAME_STATS=1
          unset JAVA_HOME             # as on a phone: wolfSSL takes the runtime's certificates, not the runner's JDK's (PKCS12)
          perl -e 'alarm shift; exec @ARGV' $(( ${{ env.SECONDS }} + 60 )) lldb --batch \
            -o 'process handle SIGSEGV -s false -p true -n false' -o 'process handle SIGBUS -s false -p true -n false' \
            -o 'settings set target.process.stop-on-exec false' \
            -o 'settings set platform.plugin.darwin.ignored-exceptions EXC_BAD_ACCESS|EXC_BAD_INSTRUCTION|EXC_ARITHMETIC' \
            -o run -k 'thread backtrace all' -k 'register read' -k 'image list' \
            -- build/fw/mac-host --art "$PWD/build/app/boot" --apk "$PWD/build/app/app/base.apk" --fwres "$PWD/build/app/app/framework-res.apk" \
            --seconds ${{ env.SECONDS }} --frames build/frames ${{ env.HOST_ARGS }} > build/app-run.log 2>&1 &
          run=$!
          # a CPU profile while the app runs (PROFILE_AT seconds in): where a frame's time goes, by function
          if [ -n "${{ env.PROFILE_AT }}" ]; then
            sleep ${{ env.PROFILE_AT }}; pid=$(pgrep -n mac-host) && sample $pid 5 -mayDie -file build/sample.txt > /dev/null 2>&1
          fi
          wait $run
          echo "exit $?"
          tr -d '\000' < build/app-run.log | grep -av 'not in a known location\|Overlapping/invalid range\|FrameStats' | tail -250
          grep -a FrameStats build/app-run.log | tail -60 || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | tail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-run
          path: |
            build/frames
            build/app-run.log
            build/sample.txt
          if-no-files-found: ignore
