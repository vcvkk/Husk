name: ART runtime on Darwin

# Builds ART's runtime (dalvikvm, libart, the class library's native code) for
# macOS arm64 from port/art/darwin/modules.json, keeping going past errors, and
# reports them grouped by file: the work list for the Darwin port. Once it all
# links, builds the class library and runs tests/dvm's Hello on it. Meanwhile an
# arm64 Linux runner compiles a boot image (port/art/boot-image.sh); the last job
# runs Hello on it on macOS: the class library's compiled code, mapped from signed
# Mach-O, with the heap above 4 GiB.

on:
  push:
    branches: [husk-port]
    paths: ['port/art/**', 'port/ios/**', 'port/framework/**', 'tests/compose-hello/**', 'tools/oat2macho.c', 'tools/oat-strip-code.py',
            '.github/workflows/darwin-art.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: brew install ninja lz4 xz icu4c openssl@3 epoll-shim ccache || true
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      # compiled objects from earlier runs: a round changes a few files, not 540
      # the runtime built (bin, lib, include), by what goes into it: with that unchanged, not rebuilt
      - uses: actions/cache/restore@v4
        id: dout
        with:
          path: |
            build/darwin/bin
            build/darwin/lib
            build/darwin/include
          key: darwin-out-${{ hashFiles('port/art/patches/**', 'port/art/darwin/**', 'port/art/build.sh') }}
      - uses: actions/cache/restore@v4
        id: jars
        with:
          path: build/darwin/java
          key: jars-${{ hashFiles('port/art/build.sh', 'port/art/darwin/javalibs.sh', 'port/art/dx-via-d8', 'port/art/patches/*') }}

      - uses: actions/cache/restore@v4
        if: steps.dout.outputs.cache-hit != 'true'
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: ART sources with husk-port's patches
        if: steps.dout.outputs.cache-hit != 'true' || steps.jars.outputs.cache-hit != 'true'
        run: |
          rev=$(sed -n 's/^ART_REV=//p' port/art/build.sh)
          git init -q build/art_standalone
          git -C build/art_standalone remote add origin https://gitlab.com/android_translation_layer/art_standalone.git
          git -C build/art_standalone fetch -q --depth 1 origin "$rev"
          git -C build/art_standalone checkout -q FETCH_HEAD
          for p in "$PWD"/port/art/patches/*.patch; do git -C build/art_standalone apply "$p"; done

      - name: Generate build.ninja
        if: steps.dout.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/darwin/lib
          inc=(); lib=()
          for f in icu4c lz4 xz openssl@3; do p=$(brew --prefix $f); inc+=(--include "$p/include"); lib+=(--lib "$p/lib"); done
          # epoll over kqueue, for libutils' Looper and OpenJDK's EPoll
          p=$(brew --prefix epoll-shim); inc+=(--include "$p/include/libepoll-shim"); lib+=(--lib "$p/lib" --ldflag=-lepoll-shim)
          clang -target arm64-apple-macos11.0 -dynamiclib -install_name @rpath/libdl_bio.dylib \
            port/art/darwin/dl_bio.c -o build/darwin/lib/libdl_bio.dylib
          python3 port/art/darwin/gen-ninja.py --launcher ccache --src build/art_standalone --out build/darwin \
            "${inc[@]}" "${lib[@]}" --lib "$PWD/build/darwin/lib" \
            --extra-src libart:port/art/darwin/libart_darwin.cc --extra-src libartbase:port/art/darwin/libartbase_darwin.cc port/art/darwin/modules.json

      - name: Build (keep going)
        if: steps.dout.outputs.cache-hit != 'true'
        env:
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
        run: |
          set +e
          export CCACHE_DIR=~/Library/Caches/ccache
          ninja -C build/darwin -k 0 > build/darwin/ninja.log 2>&1
          status=$?
          echo "ninja exit $status"
          ccache -s | head -20
          python3 port/art/darwin/errors.py build/darwin/ninja.log | tee build/darwin/errors.txt
          exit $status

      - name: Headers, with the runtime
        if: steps.dout.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/darwin/include
          cp -R build/art_standalone/libnativehelper/include/nativehelper build/darwin/include/
      - uses: actions/cache@v4
        if: steps.dout.outputs.cache-hit != 'true'
        with:
          path: build/wolfssl-macos/prefix
          key: wolfssl-macos-${{ hashFiles('port/art/darwin/wolfssl.sh', 'port/art/build.sh') }}
      - name: TLS (wolfSSL with JNI)
        if: steps.dout.outputs.cache-hit != 'true'
        run: |
          port/art/darwin/wolfssl.sh macos build/darwin/lib build/darwin/include/nativehelper \
            build/art_standalone/external/wolfssljni build/wolfssl-macos
      - uses: actions/cache/save@v4
        if: steps.dout.outputs.cache-hit != 'true'
        with:
          path: |
            build/darwin/bin
            build/darwin/lib
            build/darwin/include
          key: ${{ steps.dout.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.dout.outputs.cache-hit != 'true'
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # the jars depend only on ART's sources and these scripts
      - name: Class library (Java)
        if: steps.jars.outputs.cache-hit != 'true'
        run: |
          v=$(sed -n 's/^R8_VERSION=//p' port/art/build.sh)
          export R8_JAR="$PWD/build/r8.jar" DX="$PWD/port/art/dx-via-d8"
          curl -fsSL -o "$R8_JAR" "https://dl.google.com/android/maven2/com/android/tools/r8/$v/r8-$v.jar"
          (cd build/art_standalone && bash "$GITHUB_WORKSPACE/port/art/darwin/javalibs.sh") > build/darwin/javalibs.log 2>&1 \
            || { tail -40 build/darwin/javalibs.log; exit 1; }
          # the layout libart looks for its class library in: lib/../java/dex/art
          mkdir -p build/darwin/java/dex/art
          cp build/art_standalone/out/host/linux-x86/framework/*-hostdex.jar build/darwin/java/dex/art/
          ln -sfn ../../../lib build/darwin/java/dex/art/natives
          ls -la build/darwin/java/dex/art

      - uses: actions/cache/save@v4
        if: steps.jars.outputs.cache-hit != 'true'
        with:
          path: build/darwin/java
          key: ${{ steps.jars.outputs.cache-primary-key }}

      - name: Hello on dalvikvm (interpreter, no boot image)
        run: |
          mkdir -p build/hello/cls build/android-data/dalvik-cache
          v=$(sed -n 's/^R8_VERSION=//p' port/art/build.sh)
          [ -f build/r8.jar ] || curl -fsSL -o build/r8.jar "https://dl.google.com/android/maven2/com/android/tools/r8/$v/r8-$v.jar"
          javac --release 8 -d build/hello/cls tests/dvm/Hello.java
          java -cp build/r8.jar com.android.tools.r8.D8 --min-api 26 --output build/hello build/hello/cls/*.class
          export ANDROID_DATA="$PWD/build/android-data"
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # macOS has no timeout(1)
          args=(-Xint -Xnoimage-dex2oat -Xss8m -cp classes.dex Hello)
          cd build/hello
          set +e
          ../darwin/bin/dalvikvm "${args[@]}" > ../darwin/hello.out 2> ../darwin/hello.err &
          pid=$!
          # Hello takes well under a second: one still running after 60 s is stuck. Its threads'
          # stacks, from lldb attached to it, say where.
          for i in $(seq 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "dalvikvm still running after 60 s"
            limit 120 lldb -p $pid --batch -o 'thread backtrace all' > ../darwin/hello.lldb 2>&1
            kill -9 $pid
            status=124
          else
            wait $pid
            status=$?
          fi
          echo "dalvikvm exit $status"
          cat ../darwin/hello.out
          tail -60 ../darwin/hello.err
          if [ $status -gt 128 ]; then
            # killed by a signal: where, from lldb
            limit 120 lldb --batch -o run -k 'thread backtrace all' -k 'register read' -k quit -- \
              ../darwin/bin/dalvikvm "${args[@]}" > ../darwin/hello.lldb 2>&1
          fi
          [ -f ../darwin/hello.lldb ] && tail -200 ../darwin/hello.lldb
          exit $status

      # the runtime for the boot image job; a tarball keeps the executable bits
      - name: Pack the runtime
        run: |
          tar -czf build/darwin-runtime.tgz -C build darwin/bin darwin/lib darwin/include
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-runtime
          path: build/darwin-runtime.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-art
          path: |
            build/darwin/ninja.log
            build/darwin/errors.txt
            build/darwin/build.ninja
            build/darwin/javalibs.log
            build/darwin/hello.out
            build/darwin/hello.err
            build/darwin/hello.lldb
          if-no-files-found: ignore

  # the boot image, compiled for arm64 by dex2oat on Linux (the ART build is cached
  # by art.yml under the same key)
  boot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # what this job makes depends on these alone: with them unchanged, it is taken whole
      - uses: actions/cache/restore@v4
        id: out
        with:
          path: |
            build/boot.tgz
            build/boot-ios.tgz
          key: boot-out-${{ hashFiles('port/art/patches/**', 'port/art/build.sh', 'port/art/dx-via-d8', 'port/art/boot-image.sh', 'port/art/ci-boot.sh', 'tools/oat2macho.c', 'tools/oat-strip-code.py', 'tests/dvm/Hello.java') }}
      - name: Packages
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build autoconf automake libtool pkg-config clang zlib1g-dev openjdk-21-jdk-headless \
            libbsd-dev libelf-dev libicu-dev libssl-dev libexpat1-dev zip liblz4-dev liblzma-dev \
            libcap-dev libegl-dev libpng-dev valgrind binutils ccache
      # ART installed (build/prefix), by what goes into it; built only when that changed
      - uses: actions/cache@v4
        id: prefix
        if: steps.out.outputs.cache-hit != 'true'
        with:
          path: build/prefix
          key: art-prefix-${{ runner.arch }}-${{ hashFiles('port/art/patches/**', 'port/art/build.sh', 'port/art/dx-via-d8', 'port/art/vixl-meson.patch') }}
      - uses: actions/cache@v4
        if: (steps.out.outputs.cache-hit != 'true') && steps.prefix.outputs.cache-hit != 'true'
        with:
          path: build/art
          key: art-${{ runner.arch }}-${{ hashFiles('port/art/patches/**', 'port/art/build.sh', 'port/art/dx-via-d8', 'port/art/vixl-meson.patch') }}
      - uses: actions/cache/restore@v4
        if: (steps.out.outputs.cache-hit != 'true') && steps.prefix.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.arch }}-
      - name: ART
        if: steps.out.outputs.cache-hit != 'true'
        run: port/art/ci-install.sh
      # the compiled objects, for the next build of ART: a patch changes a few files, the rest come from here
      - uses: actions/cache/save@v4
        if: (steps.out.outputs.cache-hit != 'true') && steps.prefix.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.arch }}-${{ github.sha }}
      - name: Boot image and Hello, for macOS and iOS
        if: steps.out.outputs.cache-hit != 'true'
        run: port/art/ci-boot.sh
      - uses: actions/cache/save@v4
        if: steps.out.outputs.cache-hit != 'true'
        with:
          path: |
            build/boot.tgz
            build/boot-ios.tgz
          key: ${{ steps.out.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: boot-image-ios
          path: build/boot-ios.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: boot-image
          path: build/boot.tgz

  image:
    needs: [build, boot]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: darwin-runtime
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: boot-image
          path: build
      - name: Unpack, sign the boot image's code
        run: |
          tar -xzf build/darwin-runtime.tgz -C build
          tar -xzf build/boot.tgz -C build
          mkdir -p build/darwin/java/dex/art
          ln -sfn ../../../lib build/darwin/java/dex/art/natives
          for f in build/boot/arm64/*.dylib build/boot/hello/oat/arm64/*.dylib; do codesign -s - -f "$f"; done
          codesign -v build/boot/arm64/*.dylib build/boot/hello/oat/arm64/*.dylib
      - name: Hello on dalvikvm (boot image, everything compiled ahead of time)
        run: |
          brew install lz4 xz icu4c openssl@3 epoll-shim > /dev/null 2>&1 || true
          mkdir -p build/android-data/dalvik-cache
          export ANDROID_DATA="$PWD/build/android-data"
          B="$PWD/build/boot"
          bcp=$(tr ':' '\n' < "$B/boot.classpath" | sed "s|^/boot/|$B/jars/|" | paste -sd: -)
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          # no JIT: on Apple systems only signed code runs; everything is compiled ahead of time or interpreted
          args=(-Xusejit:false -Ximage:"$B/boot.art" -Xbootclasspath:"$bcp" -Xbootclasspath-locations:"$(cat "$B/boot.classpath")"
                -verbose:oat -Xss8m -cp "$B/hello/classes.dex" Hello)
          cd build/boot/hello
          set +e
          D=$GITHUB_WORKSPACE/build
          $D/darwin/bin/dalvikvm "${args[@]}" > $D/hello.out 2> $D/hello.err &
          pid=$!
          for i in $(seq 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "dalvikvm still running after 60 s"
            limit 120 lldb -p $pid --batch -o 'thread backtrace all' > $D/hello.lldb 2>&1
            kill -9 $pid
            status=124
          else
            wait $pid
            status=$?
          fi
          echo "dalvikvm exit $status"
          cat $D/hello.out
          # which oat files it ran, from -verbose:oat
          grep -a -i -e 'odex' -e 'oat file' $D/hello.err | head -20
          uniq -c $D/hello.err | tail -80
          if [ $status -gt 128 ]; then
            limit 120 lldb --batch -o run -k 'thread backtrace all' -k 'register read' -k quit -- \
              $D/darwin/bin/dalvikvm "${args[@]}" > $D/hello.lldb 2>&1
          fi
          [ -f $D/hello.lldb ] && tail -200 $D/hello.lldb
          printf 'Hello from husk-port%ss DVM\nsum 1..100 = 5050, args=0\nfield on null: NullPointerException\nmethod on null: NullPointerException\n' "'" | diff - $D/hello.out && [ $status -eq 0 ]

  # the runtime for iOS: the same build against the iPhone SDK and libraries built for it
  # (port/art/darwin/ios-deps.sh), keeping going past errors to list them
  ios:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # the runtime built for iOS, by what goes into it: with that unchanged, not rebuilt
      - uses: actions/cache/restore@v4
        id: iout
        with:
          path: build/ios-runtime.tgz
          key: ios-out-${{ hashFiles('port/art/patches/**', 'port/art/darwin/**', 'port/art/build.sh') }}
      - name: Packages
        if: steps.iout.outputs.cache-hit != 'true'
        run: brew install ninja ccache || true
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      # saved as soon as built: the build after it fails while the port is under way
      - uses: actions/cache/restore@v4
        if: steps.iout.outputs.cache-hit != 'true'
        id: deps
        with:
          path: build/ios-deps
          key: ios-deps-${{ hashFiles('port/art/darwin/ios-deps.sh') }}
      - name: Libraries for iOS
        if: steps.iout.outputs.cache-hit != 'true' && (steps.deps.outputs.cache-hit != 'true')
        run: port/art/darwin/ios-deps.sh build/ios-deps
      - uses: actions/cache/save@v4
        if: steps.iout.outputs.cache-hit != 'true' && (steps.deps.outputs.cache-hit != 'true')
        with:
          path: build/ios-deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        if: steps.iout.outputs.cache-hit != 'true'
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ github.sha }}
          restore-keys: ccache-ios-
      - name: ART sources with husk-port's patches
        if: steps.iout.outputs.cache-hit != 'true'
        run: |
          rev=$(sed -n 's/^ART_REV=//p' port/art/build.sh)
          git init -q build/art_standalone
          git -C build/art_standalone remote add origin https://gitlab.com/android_translation_layer/art_standalone.git
          git -C build/art_standalone fetch -q --depth 1 origin "$rev"
          git -C build/art_standalone checkout -q FETCH_HEAD
          for p in "$PWD"/port/art/patches/*.patch; do git -C build/art_standalone apply "$p"; done
      - name: Generate build.ninja
        if: steps.iout.outputs.cache-hit != 'true'
        run: |
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          D="$PWD/build/ios-deps"
          mkdir -p build/ios/lib
          xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 -isysroot "$sdk" -dynamiclib \
            -install_name @rpath/libdl_bio.dylib port/art/darwin/dl_bio.c -o build/ios/lib/libdl_bio.dylib
          python3 port/art/darwin/gen-ninja.py --target ios --sysroot "$sdk" --launcher ccache \
            --src build/art_standalone --out build/ios \
            --include "$D/include" --include "$D/include/libepoll-shim" --lib "$D/lib" --ldflag=-lepoll-shim \
            --lib "$PWD/build/ios/lib" --extra-src libart:port/art/darwin/libart_darwin.cc --extra-src libartbase:port/art/darwin/libartbase_darwin.cc port/art/darwin/modules.json
      - name: Build (keep going)
        if: steps.iout.outputs.cache-hit != 'true'
        env:
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
        run: |
          set +e
          export CCACHE_DIR=~/Library/Caches/ccache
          ninja -C build/ios -k 0 > build/ios/ninja.log 2>&1
          status=$?
          echo "ninja exit $status"
          python3 port/art/darwin/errors.py build/ios/ninja.log | tee build/ios/errors.txt
          exit $status
      - uses: actions/cache/save@v4
        if: steps.iout.outputs.cache-hit != 'true' && (always())
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ github.sha }}
      - uses: actions/cache@v4
        if: steps.iout.outputs.cache-hit != 'true'
        with:
          path: build/wolfssl-ios/prefix
          key: wolfssl-ios-${{ hashFiles('port/art/darwin/wolfssl.sh', 'port/art/build.sh') }}
      - name: TLS (wolfSSL with JNI)
        if: steps.iout.outputs.cache-hit != 'true'
        run: |
          port/art/darwin/wolfssl.sh ios build/ios/lib build/art_standalone/libnativehelper/include/nativehelper \
            build/art_standalone/external/wolfssljni build/wolfssl-ios
      - name: Pack the iOS runtime
        if: steps.iout.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/ios-runtime/include
          cp -R build/ios/lib build/ios-runtime/
          cp -R build/art_standalone/libnativehelper/include/nativehelper build/ios-runtime/include/
          tar -czf build/ios-runtime.tgz -C build ios-runtime
      - uses: actions/cache/save@v4
        if: steps.iout.outputs.cache-hit != 'true'
        with:
          path: build/ios-runtime.tgz
          key: ${{ steps.iout.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-runtime
          path: build/ios-runtime.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-art
          path: |
            build/ios/ninja.log
            build/ios/errors.txt
          if-no-files-found: ignore

  # Hello as an iOS app: unsigned for a sideloading tool to sign (Feather and the like)
  ipa:
    needs: [ios, boot]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-runtime
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: boot-image-ios
          path: build
      - name: Pack
        run: |
          tar -xzf build/ios-runtime.tgz -C build
          tar -xzf build/boot-ios.tgz -C build
          mkdir -p build/art-src/libnativehelper/include
          cp -R build/ios-runtime/include/nativehelper build/art-src/libnativehelper/include/
          port/ios/pack-ipa.sh --runtime build/ios-runtime --boot build/boot-ios --app build/boot-ios/hello \
            --main Hello --id dev.huskport.hello --name HuskHello --art-src build/art-src --out build/HuskHello.ipa
          unzip -l build/HuskHello.ipa | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: HuskHello-ipa
          path: build/HuskHello.ipa

  # an Android app for the framework jobs: a small Jetpack Compose one (tests/compose-hello),
  # built as a release app is, minified with R8
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: apk
        with:
          path: |
            tests/compose-hello/app/build/outputs/apk/release/app-release.apk
            build/framework-res.apk
          key: compose-hello-${{ hashFiles('tests/compose-hello/**', 'port/framework/strip-framework-res.py') }}
      - uses: actions/setup-java@v4
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.apk.outputs.cache-hit != 'true'
        with:
          gradle-version: '8.9'
      - name: Build
        if: steps.apk.outputs.cache-hit != 'true'
        run: gradle -p tests/compose-hello --no-daemon assembleRelease
      # the platform's resources (themes, styles, drawables apps name as android:...), from the SDK
      - name: Platform resources
        if: steps.apk.outputs.cache-hit != 'true'
        run: |
          mkdir -p build
          python3 port/framework/strip-framework-res.py "$ANDROID_HOME/platforms/android-34/android.jar" build/framework-res.apk
          ls -la build/framework-res.apk
      - uses: actions/upload-artifact@v4
        with:
          name: compose-hello-apk
          path: |
            tests/compose-hello/app/build/outputs/apk/release/app-release.apk
            build/framework-res.apk

  # the framework in a boot image, and the app compiled against it (port/framework/ci-app.sh)
  app-boot:
    # after boot: ART built once, there, and taken from the cache here
    needs: [apk, boot]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      # what this job makes depends on these alone: with them unchanged, it is taken whole
      - uses: actions/cache/restore@v4
        id: out
        with:
          path: |
            build/app/macos.tgz
            build/app/ios.tgz
          key: app-out-${{ hashFiles('port/art/patches/**', 'port/art/build.sh', 'port/art/dx-via-d8', 'port/art/vixl-meson.patch', 'port/art/boot-image.sh', 'port/framework/ci-app.sh', 'port/framework/build.sh', 'port/framework/src/**', 'port/framework/gen-src/**', 'port/framework/stubs/**', 'port/framework/gen/**', 'port/framework/strip-framework-res.py', 'tools/oat2macho.c', 'tools/oat-strip-code.py', 'tests/compose-hello/**') }}
      - uses: actions/download-artifact@v4
        if: steps.out.outputs.cache-hit != 'true'
        with:
          name: compose-hello-apk
          path: build/apk
      - name: Packages
        if: steps.out.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq meson ninja-build autoconf automake libtool pkg-config clang zlib1g-dev openjdk-21-jdk-headless \
            libbsd-dev libelf-dev libicu-dev libssl-dev libexpat1-dev zip liblz4-dev liblzma-dev \
            libcap-dev libegl-dev libpng-dev valgrind binutils ccache
      # ART installed (build/prefix), by what goes into it; built only when that changed
      - uses: actions/cache@v4
        id: prefix
        if: steps.out.outputs.cache-hit != 'true'
        with:
          path: build/prefix
          key: art-prefix-${{ runner.arch }}-${{ hashFiles('port/art/patches/**', 'port/art/build.sh', 'port/art/dx-via-d8', 'port/art/vixl-meson.patch') }}
      - uses: actions/cache@v4
        if: steps.out.outputs.cache-hit != 'true' && steps.prefix.outputs.cache-hit != 'true'
        with:
          path: build/art
          key: art-${{ runner.arch }}-${{ hashFiles('port/art/patches/**', 'port/art/build.sh', 'port/art/dx-via-d8', 'port/art/vixl-meson.patch') }}
      - uses: actions/cache/restore@v4
        if: steps.out.outputs.cache-hit != 'true' && steps.prefix.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.arch }}-
      - name: ART
        if: steps.out.outputs.cache-hit != 'true'
        run: port/art/ci-install.sh
      # the compiled objects, for the next build of ART: a patch changes a few files, the rest come from here
      - uses: actions/cache/save@v4
        if: (steps.out.outputs.cache-hit != 'true') && steps.prefix.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.arch }}-${{ github.sha }}
      - name: Framework, boot image, the app
        if: steps.out.outputs.cache-hit != 'true'
        run: port/framework/ci-app.sh build/apk/tests/compose-hello/app/build/outputs/apk/release/app-release.apk build/app build/apk/build/framework-res.apk
      - uses: actions/cache/save@v4
        if: steps.out.outputs.cache-hit != 'true'
        with:
          path: |
            build/app/macos.tgz
            build/app/ios.tgz
          key: ${{ steps.out.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: build/app/macos.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: build/app/ios.tgz

  # the app on macOS, no window: its frames as PNG files
  app-mac:
    needs: [build, app-boot]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: darwin-runtime
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: app-macos
          path: build
      - name: Unpack, sign the compiled code
        run: |
          brew install lz4 xz icu4c openssl@3 epoll-shim > /dev/null 2>&1 || true
          tar -xzf build/darwin-runtime.tgz -C build
          mkdir -p build/app && tar -xzf build/macos.tgz -C build/app
          for f in build/app/boot/arm64/*.dylib build/app/app/oat/arm64/*.dylib; do codesign -s - -f "$f"; done
      - name: Natives and the test host
        run: port/framework/build-natives.sh macos build/fw build/darwin/include/nativehelper "$PWD/build/darwin/lib"
      - name: CoreGraphics pixel formats
        run: clang -O2 -o build/cg-bench port/framework/host/cg-bench.c -framework CoreGraphics && build/cg-bench
      - name: Run the app
        run: |
          set +e
          export HUSK_FRAME_STATS=1   # FrameStats lines: where a frame's time goes
          perl -e 'alarm shift; exec @ARGV' 120 build/fw/mac-host --art "$PWD/build/app/boot" --apk "$PWD/build/app/app/base.apk" --fwres "$PWD/build/app/app/framework-res.apk" \
            --seconds 15 --frames build/frames --tap 400,760@3 --type "Привет 👋@5" --tap 540,1300@8 > build/app-run.log 2>&1 &
          host=$!
          # a CPU profile while it animates: where a frame's time goes, by function
          sleep 9; sample $host 4 -mayDie -file build/sample.txt > /dev/null 2>&1
          wait $host
          status=$?
          echo "mac-host exit $status"
          tr -d '\000' < build/app-run.log | grep -av 'not in a known location\|Overlapping/invalid range\|FrameStats' | tail -150
          grep -a FrameStats build/app-run.log || true
          ls -la build/frames
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-frames
          path: |
            build/frames
            build/app-run.log
            build/sample.txt
          if-no-files-found: ignore

  # the Compose app as an iOS app: unsigned for a sideloading tool to sign
  app-ipa:
    needs: [ios, app-boot]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-runtime
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: app-ios
          path: build
      - name: Natives and the app
        run: |
          tar -xzf build/ios-runtime.tgz -C build
          mkdir -p build/app && tar -xzf build/ios.tgz -C build/app
          port/framework/build-natives.sh ios build/fw-ios build/ios-runtime/include/nativehelper
          port/ios/pack-app.sh --runtime build/ios-runtime --files build/app --natives build/fw-ios/libhuskframework.a \
            --name ComposeHello --id dev.huskport.composehello --out build/ComposeHello.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ComposeHello-ipa
          path: build/ComposeHello.ipa
